<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B9FDB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5FBF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Left plane (light blue) -->
  <polygon points="80,40 180,80 180,160 80,120" fill="#6B9FDB" opacity="0.7"/>
  
  <!-- Middle plane (dark blue) -->
  <polygon points="140,30 220,70 220,160 140,120" fill="#001F5C"/>
  
  <!-- Right plane (cyan) -->
  <polygon points="200,50 280,90 280,170 200,130" fill="#00B4E8"/>
  
  <!-- Bottom plane (purple) -->
  <polygon points="80,120 180,160 280,170 180,130" fill="#8B5FBF" opacity="0.8"/>
</svg>