<svg viewBox="0 0 1920 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Abstract 3D shape -->
  <g>
    <!-- Light purple/blue back plane -->
    <polygon points="330,130 500,50 600,150 430,230" fill="#7B9FD8" opacity="0.8"/>
    
    <!-- Dark blue middle plane -->
    <polygon points="380,180 550,100 620,200 450,280" fill="#001F5C"/>
    
    <!-- Bright cyan front plane -->
    <polygon points="430,140 600,60 700,160 530,240" fill="#00A8E8"/>
    
    <!-- Purple bottom plane -->
    <polygon points="330,230 500,310 600,350 430,270" fill="#8B5FBF" opacity="0.9"/>
  </g>
  
  <!-- Text: Future Learning Labs -->
  <text x="750" y="240" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="#001F5C">Future</text>
  <text x="750" y="320" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="#001F5C">Learning</text>
  <text x="750" y="400" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="#001F5C">Labs</text>
  
  <!-- Tagline -->
  <text x="750" y="440" font-family="Arial, sans-serif" font-size="36" letter-spacing="8" fill="#6B8DBE">IDEAS TO IMPACT</text>
</svg>